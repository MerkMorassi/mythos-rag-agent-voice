<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYTHOS :: LOREPACK FACTORY v3.7.0</title>
  <link rel="stylesheet" href="css/lorepack-final.css" />
</head>
<body>
  <div class="header">
    <div class="brand">MYTHOS <span class="text-dim-alt">//</span> LOREPACK FACTORY</div>
    <div class="text-dim-small">STATUS: <span id="sysStatus" class="text-main-color">GRAPH READY</span></div>
  </div>

  <div class="main-grid">
    <div class="controls">
      <input id="agentId" type="text" placeholder="AGENT ID" />

      <div class="input-group">
        <label>MODEL OVERRIDE</label>
        <select id="modelSelect">
          <option value="gemini-2.5-flash" selected>GEMINI 2.5 FLASH</option>
          <option value="gemini-2.5-pro">GEMINI 2.5 PRO</option>
        </select>
      </div>

      <div class="input-group">
        <label id="togglePrompt">[<span id="promptInd">+</span>] SYSTEM INSTRUCTIONS</label>
        <div id="prompt" class="collapsible-content" style="display:none;">
          <textarea id="systemPrompt" rows="6"></textarea>
        </div>
      </div>

      <div class="input-group">
        <label id="toggleKeys">[<span id="keysInd">+</span>] PARALLEL API ARRAY</label>
        <div id="keys" class="collapsible-content" style="display:none;">
          <input id="k1" type="password" placeholder="KEY 1" />
          <input id="k2" type="password" placeholder="KEY 2" />
          <input id="k3" type="password" placeholder="KEY 3" />
        </div>
      </div>

      <div class="input-group">
        <label>EMBED BATCH SIZE</label>
        <input id="batchSize" type="number" min="1" max="200" value="40" />
      </div>

      <div class="input-group">
        <label>LANES PER KEY</label>
        <input id="lanesPerKey" type="number" min="1" max="20" value="3" />
      </div>

      <button id="saveBtn" class="btn">LOCK PARAMETERS</button>

      <hr class="sep" />

      <button class="btn" id="stageFilesBtn">[+] STAGE FILES</button>
      <input id="fileInput" type="file" multiple class="hidden-element" style="display:none;" />

      <button id="ingestBtn" class="btn">INGEST LORE</button>
      
      <button id="buildGraphBtn" class="btn text-main-color">BUILD GRAPH LITE</button>

      <button id="exportBtn" class="btn">EXPORT (GZIP)</button>
      <button id="importBtn" class="btn">IMPORT (GZIP)</button>
      <input id="importFile" type="file" accept=".gz,.jsonl,.json" class="hidden-element" style="display:none;" />

      <button id="nukeTrigger" class="btn text-error-color margin-top-auto">NUKE VAULT</button>
    </div>

    <div class="dashboard">
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">TOTAL NODES/EDGES</span>
          <span id="statVectors" class="stat-value active">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">STAGED</span>
          <span id="statChunks" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">STATE</span>
          <span id="statState" class="text-state-idle stat-value">IDLE</span>
        </div>
      </div>

      <div class="display-flex justify-content-space-between padding-bottom-5px">
        <div class="font-size-sm text-dim-alt">LOG: <span id="statVectorsLog" class="text-white">0</span></div>
        <div id="clearLogBtn" class="cursor-pointer text-dim-alt font-size-sm">[X] CLEAR LOG</div>
      </div>

      <div id="logConsole"></div>

      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="terminal-group">
        <textarea id="chatInput" placeholder="Command Oracle." rows="1" class="flex-1"></textarea>
        <button id="sendBtn" class="btn padding-0-20px">SEND</button>
      </div>
    </div>
  </div>

  <div id="nukeModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>PURGE VAULT?</h2>
      <div class="row">
        <button id="nukeConfirmBtn" class="btn danger flex-1">CONFIRM</button>
        <button onclick="document.getElementById('nukeModal').style.display='none'" class="btn flex-1">CANCEL</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/lorepack-final.js"></script>
</body>
</html>
