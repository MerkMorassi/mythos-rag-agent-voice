<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MYTHOS :: Single Chat</title>

<style>
:root {
  --bg:#0a0a0a; --panel:#111; --term:#121212;
  --text:#e0e0e0; --dim:#777; --accent:#ff3300; --sys:#3399ff;
}
* { box-sizing:border-box; }
body {
  margin:0; padding:16px; height:100vh;
  background:var(--bg); color:var(--text);
  font-family:JetBrains Mono, monospace;
  display:flex; flex-direction:column;
}
header {
  display:flex; justify-content:space-between;
  border-bottom:1px solid #333; padding-bottom:8px;
}
main { flex:1; display:flex; gap:16px; margin-top:12px; overflow:hidden; }
aside {
  width:320px; background:var(--panel); padding:10px;
  border:1px solid #333; overflow-y:auto;
}
section {
  flex:1; display:flex; flex-direction:column;
}
#messages {
  flex:1; background:var(--term); padding:12px;
  border:1px solid #333; overflow-y:auto;
  display:flex; flex-direction:column; gap:10px;
}
.msg { border-left:3px solid #444; padding-left:10px; white-space:pre-wrap; }
.msg.user { border-color:#00ff41; }
.msg.agent { border-color:var(--accent); }
.msg.sys { border-color:var(--sys); color:var(--sys); font-size:0.85em; }

label { font-size:0.8em; color:var(--dim); }
input, textarea, button {
  width:100%; background:#222; color:#fff;
  border:1px solid #444; padding:6px;
  font-family:inherit;
}
textarea { resize:vertical; }
button:hover { border-color:var(--accent); cursor:pointer; }

footer {
  display:flex; gap:8px; margin-top:8px;
}
#userInput {
  flex: 1;
}
#sendBtn {
  width: 100px;
}
.instructions {
    background: #222;
    padding: 10px;
    border: 1px solid #444;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<header>
  <div><strong>MYTHOS</strong> :: SINGLE CHAT</div>
  <div id="status" style="color:var(--dim)">[ idle ]</div>
</header>

<main>

<aside>
  <div class="instructions">
    <p><strong>Instructions:</strong></p>
    <ol>
        <li>Enter your Gemini API key below.</li>
        <li>Click "Choose File" to upload a LorePack (.json).</li>
        <li>Chat with the agent from the LorePack.</li>
    </ol>
  </div>

  <label>Gemini API Key <span id="apiKeyStatus"></span></label>
  <textarea id="apiKey" rows="2"></textarea>

  <label style="margin-top:8px;">Load LorePack</label>
  <input type="file" id="loreInput" accept=".json">

  <div id="loreInfo" style="margin-top:6px;font-size:0.8em;color:var(--dim)">
    No lore loaded
  </div>
</aside>

<section>
  <div id="messages"></div>

  <footer>
    <textarea id="userInput" rows="2"></textarea>
    <button id="sendBtn">SEND</button>
  </footer>
</section>

</main>

<script type="module">
import { SimpleDB } from './js/core/mythos-db.js';

const messages = document.getElementById('messages');
const status = document.getElementById('status');
const apiKey = document.getElementById('apiKey');
const loreInput = document.getElementById('loreInput');
const loreInfo = document.getElementById('loreInfo');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const apiKeyStatus = document.getElementById('apiKeyStatus');

const db = new SimpleDB();
const MODEL = 'gemini-2.5-flash';
let currentAgent = null;

// --- API Key Validation ---
let validationTimeout;
async function validateApiKey(key) {
    if (!key) {
        apiKeyStatus.textContent = '';
        return;
    }
    apiKeyStatus.textContent = '...';
    try {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        if (r.ok) {
            apiKeyStatus.textContent = '✅';
            localStorage.setItem('mythos_gemini_key', key);
            log('API Key is valid.', 'sys');
        } else {
            const err = await r.json();
            apiKeyStatus.textContent = '❌';
            log(`API Key Error: ${err.error.message}`, 'sys');
        }
    } catch (e) {
        apiKeyStatus.textContent = '❌';
        log(`Network error validating API key.`, 'sys');
    }
}

apiKey.addEventListener('keyup', () => {
    clearTimeout(validationTimeout);
    validationTimeout = setTimeout(() => {
        validateApiKey(apiKey.value.trim());
    }, 500);
});

const storedKey = localStorage.getItem('mythos_gemini_key');
if (storedKey) {
    apiKey.value = storedKey;
    validateApiKey(storedKey);
}

function log(msg, cls='sys') {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = msg;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}

function cosine(a,b) {
  let dot=0, na=0, nb=0;
  for (let i=0;i<a.length;i++) {
    dot+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i];
  }
  return dot/(Math.sqrt(na)*Math.sqrt(nb))||0;
}

async function embed(text, key) {
  const r = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent?key=${key}`,
    {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ content:{ parts:[{text}] } })
    }
  );
  if (!r.ok) {
      const err = await r.json();
      throw new Error(err.error?.message || `Embed API Error HTTP ${r.status}`);
  }
  const j = await r.json();
  if (!j.embedding) throw new Error(j.error?.message||'Embed failed');
  return j.embedding.values;
}

function extractText(j) {
  if (j.text) return j.text;
  if (j.candidates?.length) {
    for (const c of j.candidates) {
      const parts = c.content?.parts;
      if (parts) {
        for (const p of parts) {
          if (p.text) return p.text;
        }
      }
    }
  }
  return null;
}

async function generate(prompt, key, model, systemInstruction) {
  const r = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
    {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{
            role: 'user',
            parts:[{text:prompt}]
        }],
        systemInstruction: {
            parts: [{text: systemInstruction}]
        }
      })
    }
  );
  if (!r.ok) {
      const err = await r.json();
      throw new Error(err.error?.message || `Generate API Error HTTP ${r.status}`);
  }
  const j = await r.json();
  const txt = extractText(j);
  if (!txt) throw new Error('Empty model response');
  return txt;
}

loreInput.onchange = async () => {
    const f = loreInput.files[0];
    if (!f) return;

    log(`Processing LorePack: ${f.name}...`, 'sys');
    
    const reader = new FileReader();
    
    reader.onload = async (evt) => {
        try {
            const text = evt.target.result;
            if (!text) throw new Error(`File ${f.name} is empty or could not be read.`);
            
            const j = JSON.parse(text);
            
            let agentInfo;
            let sacredArchive;

            if (Array.isArray(j)) {
                sacredArchive = j;
                const parts = f.name.split('.');
                if (parts.length > 2) {
                    const agentId = parts[2].toUpperCase();
                    agentInfo = {
                        id: agentId,
                        handle: agentId,
                        system_instruction: `You are ${agentId}.`
                    };
                } else {
                    throw new Error("Could not determine agent from filename for array-based LorePack.");
                }
            } else if (typeof j === 'object' && j !== null) {
                agentInfo = j.agent || j.header?.agent || j.header;
                sacredArchive = j.sacred_archive || j.nodes;
            }

            if (!agentInfo || !sacredArchive) {
                throw new Error("Invalid LorePack format. Missing agent/header or sacred_archive/nodes property.");
            }

            const incomingAgent = {
                id: agentInfo.id || 'UNTITLED_AGENT',
                handle: agentInfo.handle || agentInfo.name || 'Untitled Agent',
                system_instruction: agentInfo.system_instruction || `You are ${agentInfo.handle || agentInfo.name || 'an AI assistant'}.`
            };
            
            if (!confirm(`This will clear lore for agent ${incomingAgent.handle} and load the new LorePack. Are you sure?`)) {
                loreInput.value = '';
                return;
            }
            currentAgent = incomingAgent;

            // Clear old lore
            await db.ready;
            const tx = db.db.transaction('vectors', 'readwrite');
            const store = tx.objectStore('vectors');
            const index = store.index('agentId');
            const req = index.openKeyCursor(IDBKeyRange.only(currentAgent.id));
            req.onsuccess = () => {
                const cursor = req.result;
                if (cursor) {
                    store.delete(cursor.primaryKey);
                    cursor.continue();
                }
            }
            await new Promise(resolve => tx.oncomplete = resolve);

            // Add new lore
            let nodesLoaded = 0;
            for (const node of sacredArchive) {
                if (!node.id) node.id = crypto.randomUUID();
                node.agentId = currentAgent.id;
                await db.put('vectors', node);
                nodesLoaded++;
            }

            loreInfo.textContent = `Agent: ${currentAgent.handle} (${nodesLoaded} nodes).`;
            log(`LorePack for agent ${currentAgent.handle} loaded.`, 'sys');

        } catch (e) {
            log(`ERROR: ${e.message}`, 'sys');
            console.error(e);
            currentAgent = null;
        }
        loreInput.value = '';
    };

    reader.onerror = (e) => {
        log(`ERROR: Failed to read file ${f.name}.`, 'sys');
        console.error(e);
    };

    reader.readAsText(f);
};

sendBtn.onclick = async () => {
  const key = apiKey.value.trim();
  const q = userInput.value.trim();

  if (!key) return alert('API key required');
  if (!currentAgent) return alert('Load a valid LorePack file first.');
  if (!q) return;

  await db.ready;
  const loreForAgent = await db.getByIndex('vectors', 'agentId', currentAgent.id);

  userInput.value='';
  log(q,'user');
  status.textContent='[ thinking ]';

  try {
    const qv = await embed(q, key);
    
    const top = loreForAgent
      .map(v => ({...v, score: cosine(qv, v.vector || v.values || v.embedding)}))
      .sort((a,b)=>b.score-a.score)
      .slice(0,6);

    const ctx = top.map(v=>v.text).join('\n---\n');
    const reply = await generate(
      `CONTEXT:\n${ctx}\n\nUSER:\n${q}`,
      key,
      MODEL,
      currentAgent.system_instruction || `You are ${currentAgent.handle}.`
    );

    log(reply,'agent');
  } catch(e) {
    log('ERROR: '+e.message,'sys');
  } finally {
    status.textContent='[ idle ]';
  }
};
</script>

</body>
</html>
